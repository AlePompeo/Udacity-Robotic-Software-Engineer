# AMCL parameters (loaded by launch/amcl.launch)

# Frames
odom_frame_id: odom
odom_model_type: diff-corrected
base_frame_id: robot_footprint
global_frame_id: map

# Initial pose, the same as in world.launch (x = 0, y = -5, yaw = 1.5708)
initial_pose_x: 0
initial_pose_y: -5
initial_pose_a: 1.5708

# Particle filter
min_particles: 100
max_particles: 2000
update_min_d: 0.1
update_min_a: 0.1
transform_tolerance: 0.2

# Laser: likelihood field model
laser_model_type: likelihood_field
laser_max_beams: 60
laser_z_hit: 0.95
laser_z_rand: 0.05
