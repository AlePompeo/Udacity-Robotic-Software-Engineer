controller_frequency: 10

DWAPlannerROS:
  # Speed limits
  max_vel_x: 0.5
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.5
  min_vel_trans: 0.05
  max_vel_theta: 1.2
  min_vel_theta: 0.3
  acc_lim_x: 1.5
  acc_lim_y: 0.0
  acc_lim_theta: 3.0

  # Goal tolerances
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.4
  latch_xy_goal_tolerance: true

  # Trajectory simulation
  sim_time: 2.0
  sim_granularity: 0.05
  vx_samples: 10
  vy_samples: 1
  vth_samples: 30

  # Trajectory scoring
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  oscillation_reset_dist: 0.05
  prune_plan: true
