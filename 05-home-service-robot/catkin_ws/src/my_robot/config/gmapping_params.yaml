# gmapping parameters (loaded by launch/mapping.launch)
base_frame: robot_footprint
odom_frame: odom
map_frame: map

map_update_interval: 1.0
maxUrange: 8.0
maxRange: 12.0

# The odometry of the simulated robot is exact: small motion noise
srr: 0.01
srt: 0.02
str: 0.01
stt: 0.02

# Scan matching
sigma: 0.05
kernelSize: 1
lstep: 0.05
astep: 0.05
iterations: 5
lsigma: 0.075
ogain: 3.0
lskip: 0
minimumScore: 50

# Update thresholds and particles
linearUpdate: 0.2
angularUpdate: 0.2
temporalUpdate: 3.0
resampleThreshold: 0.5
particles: 30

# Map size and resolution
xmin: -12.0
ymin: -12.0
xmax: 12.0
ymax: 12.0
delta: 0.05
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005
